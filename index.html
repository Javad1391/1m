<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حل معادله - هر طور بنویس!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-area {
            position: relative;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            text-align: center;
            direction: ltr;
            resize: none;
            min-height: 80px;
            transition: border-color 0.3s;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .example-btn {
            padding: 6px 12px;
            background: #f0f4ff;
            border: 1px solid #c5d2f0;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            direction: ltr;
            color: #555;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .hint {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        button.solve-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.solve-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .standard-form {
            margin-top: 20px;
            padding: 15px;
            background: #fffbea;
            border: 2px dashed #f39c12;
            border-radius: 10px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            direction: ltr;
            display: none;
        }

        .standard-form.show { display: block; }

        .standard-form .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            font-family: 'Segoe UI', sans-serif;
            direction: rtl;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .result.show { display: block; }

        .result h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
        }

        .result-item {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border-right: 4px solid #667eea;
            font-size: 15px;
        }

        .result-item.math {
            direction: ltr;
            text-align: left;
            font-family: 'Courier New', monospace;
        }

        .result-item strong { color: #333; }

        .error {
            color: #c0392b;
            background: #fdecea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>حل معادله</h1>
        <p class="subtitle">معادله را هر طور که دوست داری بنویس!</p>
        
        <div class="input-area">
            <textarea id="equation" placeholder="مثلاً: 2x^2 - 5x = -3"></textarea>
        </div>

        <div class="examples">
            <button class="example-btn" onclick="setExample('x^2 - 5x + 6 = 0')">x^2 - 5x + 6 = 0</button>
            <button class="example-btn" onclick="setExample('2x^2 - 8 = 0')">2x^2 - 8 = 0</button>
            <button class="example-btn" onclick="setExample('3x + 7 = 2x - 1')">3x + 7 = 2x - 1</button>
            <button class="example-btn" onclick="setExample('x^2 = 4')">x^2 = 4</button>
            <button class="example-btn" onclick="setExample('-x^2 + 4x = 0')">-x^2 + 4x = 0</button>
            <button class="example-btn" onclick="setExample('x^2 + x + 1 = 0')">x^2 + x + 1 = 0</button>
        </div>
        
        <p class="hint">
            💡 می‌توانی از <code>x^2</code> یا <code>x²</code> استفاده کنی<br>
            لازم نیست معادله استاندارد باشد، هر طور بنویسی حل می‌شود!
        </p>
        
        <button class="solve-btn" onclick="solveEquation()">حل کن</button>
        
        <div class="error" id="error"></div>
        
        <div class="standard-form" id="standardForm">
            <div class="label">فرم استاندارد:</div>
            <div id="standardEq"></div>
        </div>
        
        <div class="result" id="result">
            <h2>نتایج</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        function setExample(eq) {
            document.getElementById('equation').value = eq;
            document.getElementById('error').classList.remove('show');
            document.getElementById('result').classList.remove('show');
            document.getElementById('standardForm').classList.remove('show');
        }

        function fmt(n) {
            if (Number.isInteger(n)) return n.toString();
            return parseFloat(n.toFixed(4)).toString();
        }

        // ساخت رشته معادله استاندارد از ضرایب
        function buildEquationStr(a, b, c) {
            let parts = [];
            
            if (a !== 0) {
                if (a === 1) parts.push('x²');
                else if (a === -1) parts.push('-x²');
                else parts.push(fmt(a) + 'x²');
            }
            
            if (b !== 0) {
                if (parts.length > 0) {
                    if (b === 1) parts.push('+ x');
                    else if (b === -1) parts.push('- x');
                    else if (b > 0) parts.push('+ ' + fmt(b) + 'x');
                    else parts.push('- ' + fmt(Math.abs(b)) + 'x');
                } else {
                    if (b === 1) parts.push('x');
                    else if (b === -1) parts.push('-x');
                    else parts.push(fmt(b) + 'x');
                }
            }
            
            if (c !== 0) {
                if (parts.length > 0) {
                    if (c > 0) parts.push('+ ' + fmt(c));
                    else parts.push('- ' + fmt(Math.abs(c)));
                } else {
                    parts.push(fmt(c));
                }
            }
            
            const expr = parts.length > 0 ? parts.join(' ') : '0';
            return expr + ' = 0';
        }

        // تجزیه عبارت به ضرایب a, b, c
        function parseExpression(expr) {
            // نرمال‌سازی
            let s = expr.replace(/\s+/g, '');
            s = s.replace(/²/g, '^2');
            s = s.replace(/X/g, 'x');
            
            let a = 0, b = 0, c = 0;
            
            // جداسازی جملات با حفظ علامت
            // الگو: پیدا کردن هر جمله (با علامت اختیاری در ابتدا)
            const tokens = [];
            let current = '';
            
            for (let i = 0; i < s.length; i++) {
                const ch = s[i];
                if ((ch === '+' || ch === '-') && i > 0) {
                    if (current !== '') tokens.push(current);
                    current = ch;
                } else {
                    current += ch;
                }
            }
            if (current !== '') tokens.push(current);
            
            // پردازش هر جمله
            for (let token of tokens) {
                if (token === '' || token === '+' || token === '-') continue;
                
                // تشخیص نوع جمله
                // حالت 1: شامل x^2
                if (token.includes('x^2')) {
                    let coef = token.replace('x^2', '');
                    if (coef === '' || coef === '+') coef = '1';
                    else if (coef === '-') coef = '-1';
                    a += parseFloat(coef);
                }
                // حالت 2: شامل x (بدون ^2)
                else if (token.includes('x')) {
                    let coef = token.replace('x', '');
                    if (coef === '' || coef === '+') coef = '1';
                    else if (coef === '-') coef = '-1';
                    b += parseFloat(coef);
                }
                // حالت 3: عدد ثابت
                else {
                    c += parseFloat(token);
                }
            }
            
            return { a, b, c };
        }

        function solveEquation() {
            const input = document.getElementById('equation').value.trim();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            const standardForm = document.getElementById('standardForm');
            const standardEq = document.getElementById('standardEq');
            
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            standardForm.classList.remove('show');
            
            if (!input) {
                errorDiv.textContent = 'لطفاً یک معادله وارد کنید!';
                errorDiv.classList.add('show');
                return;
            }
            
            // جداسازی دو طرف معادله
            let left = '', right = '0';
            if (input.includes('=')) {
                const parts = input.split('=');
                if (parts.length !== 2) {
                    errorDiv.textContent = 'معادله نامعتبر است! فقط یک = باید داشته باشد.';
                    errorDiv.classList.add('show');
                    return;
                }
                left = parts[0];
                right = parts[1];
            } else {
                left = input;
            }
            
            // تجزیه دو طرف
            let leftParsed, rightParsed;
            try {
                leftParsed = parseExpression(left);
                rightParsed = parseExpression(right);
            } catch (e) {
                errorDiv.textContent = 'خطا در تجزیه معادله! لطفاً فرمت را بررسی کنید.';
                errorDiv.classList.add('show');
                return;
            }
            
            // انتقال همه چیز به سمت چپ: left - right = 0
            const a = leftParsed.a - rightParsed.a;
            const b = leftParsed.b - rightParsed.b;
            const c = leftParsed.c - rightParsed.c;
            
            // نمایش فرم استاندارد
            standardEq.textContent = buildEquationStr(a, b, c);
            standardForm.classList.add('show');
            
            let html = '';
            
            // حالت 1: همه صفر
            if (a === 0 && b === 0 && c === 0) {
                html += `<div class="result-item"><strong>نوع معادله:</strong> اتحاد</div>`;
                html += `<div class="result-item"><strong>نتیجه:</strong> هر عدد حقیقی جواب است ✓</div>`;
            }
            // حالت 2: معادله ناممکن
            else if (a === 0 && b === 0) {
                html += `<div class="result-item"><strong>نوع معادله:</strong> ناممکن</div>`;
                html += `<div class="result-item"><strong>نتیجه:</strong> هیچ جوابی ندارد ✗</div>`;
            }
            // حالت 3: درجه اول
            else if (a === 0) {
                const x = -c / b;
                html += `<div class="result-item"><strong>نوع معادله:</strong> درجه اول (خطی)</div>`;
                html += `<div class="result-item math"><strong>معادله استاندارد:</strong> ${buildEquationStr(a, b, c)}</div>`;
                html += `<div class="result-item math"><strong>جواب:</strong> x = ${fmt(x)}</div>`;
            }
            // حالت 4: درجه دوم
            else {
                const delta = b * b - 4 * a * c;
                html += `<div class="result-item"><strong>نوع معادله:</strong> درجه دوم</div>`;
                html += `<div class="result-item math"><strong>معادله استاندارد:</strong> ${buildEquationStr(a, b, c)}</div>`;
                html += `<div class="result-item math"><strong>Δ = b² − 4ac =</strong> ${fmt(delta)}</div>`;
                
                if (delta > 0) {
                    const x1 = (-b + Math.sqrt(delta)) / (2 * a);
                    const x2 = (-b - Math.sqrt(delta)) / (2 * a);
                    html += `<div class="result-item"><strong>نوع ریشه‌ها:</strong> دو ریشه حقیقی متمایز</div>`;
                    html += `<div class="result-item math"><strong>x₁ =</strong> ${fmt(x1)}</div>`;
                    html += `<div class="result-item math"><strong>x₂ =</strong> ${fmt(x2)}</div>`;
                } else if (delta === 0) {
                    const x = -b / (2 * a);
                    html += `<div class="result-item"><strong>نوع ریشه‌ها:</strong> ریشه مضاعف</div>`;
                    html += `<div class="result-item math"><strong>x =</strong> ${fmt(x)}</div>`;
                } else {
                    const realPart = -b / (2 * a);
                    const imagPart = Math.sqrt(-delta) / (2 * a);
                    html += `<div class="result-item"><strong>نوع ریشه‌ها:</strong> دو ریشه مختلط مزدوج</div>`;
                    html += `<div class="result-item math"><strong>x₁ =</strong> ${fmt(realPart)} + ${fmt(Math.abs(imagPart))}i</div>`;
                    html += `<div class="result-item math"><strong>x₂ =</strong> ${fmt(realPart)} − ${fmt(Math.abs(imagPart))}i</div>`;
                }
            }
            
            resultContent.innerHTML = html;
            resultDiv.classList.add('show');
        }

        // حل با Enter
        document.getElementById('equation').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                solveEquation();
            }
        });
    </script>
</body>
      </html>
